cargo-features = ["edition2024"]

[package]
name = "rapx"
version = "0.6.0"
edition = "2021"
authors = ["Artisan-Lab <xuh@fudan.edu.cn>"]
default-run = "rapx"
license = "MPL-2.0"
description = "A static analysis platform for use-after-free, memory leakage detection, etc"
documentation = "https://artisan-lab.github.io/RAPx-Book/"
repository = "https://github.com/Artisan-Lab/RAPx"
readme = "../README.md"

[[bin]]
name = "rapx"

[[bin]]
name = "cargo-rapx"

[lib]
name = "rapx"
doctest = false

[dependencies]
lazy_static = "1.4"
snafu = "0.7.0"
chrono = "0.4.19"
serde_json = "1.0.72"
z3 = "0.13.3"
# this version of z3-sys use Rust 2018 edition
z3-sys = "=0.9.4"
log = "0.4.14"
fern = { version = "0.6.2", features = ["colored"] }
wait-timeout = "0.2.0"
rustc-demangle = "0.1.21"
colorful = "0.2.1"
serde = "1.0.215"
regex = "1.11.1"
once_cell = "1.20.1"
walkdir = "2"
cargo_metadata = "0.18"
annotate-snippets = "0.11.4"
petgraph = "0.8.1"
if_chain = "1.0"
num-traits = "0.2.19"
intervals = "2.1"
rand = "0.9.0"
toml = "0.8.23"
itertools = "0.14.0"
#safety-parser = "0.4.1"
safety-parser = { path = "../patch/safety-parser" }
syn = { version = "2", features = ["extra-traits", "full"] }

# these version use Rust 1.66.0
serde_spanned = "=1.0.1"
toml_writer = "=1.0.2"
toml_parser = "=1.0.2"
cargo-platform = "=0.1.8"
indexmap = "=2.11.4"
toml_datetime = "=0.7.1"

[features]
backtraces = ["snafu/backtraces", "snafu/backtraces-impl-backtrace-crate"]

[package.metadata.rust-analyzer]
rustc_private = true

#[patch.crates-io]
#safety-parser = { git = 'https://github.com/os-checker/tag-std.git', branch = "safety-parser#edition2021" }
